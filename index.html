<!DOCTYPE html>
<html>
<head>
  <title>My AI Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    /* ---- THEME VARIABLES ---- */
    :root {
      --bg: radial-gradient(ellipse at top, #faf6ec 0%, #f0e9d8 70%);
      --text: #2a2418;
      --bubble-ai: rgba(255, 255, 255, 0.18);
      --bubble-ai-text: #2f2a1c;
      --input-bg: #ffffff;
      --border: #d8cfb6;
      --muted: #9a8f74;
    }
    :root[data-theme="dark"] {
      --bg: radial-gradient(ellipse at top, #1a1610 0%, #0c0a07 70%);
      --text: #eae6dd;
      --bubble-ai: rgba(33, 29, 20, 0.18);
      --bubble-ai-text: #eae6dd;
      --input-bg: #17140d;
      --border: #3a3221;
      --muted: #8a8066;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="dark"]) {
        --bg: radial-gradient(ellipse at top, #1a1610 0%, #0c0a07 70%);
        --text: #eae6dd;
        --bubble-ai: rgba(33, 29, 20, 0.18);
        --bubble-ai-text: #eae6dd;
        --input-bg: #17140d;
        --border: #3a3221;
        --muted: #8a8066;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      max-width: 640px; margin: 0 auto; padding: 20px;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; height: 100vh;
    }
    header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0 18px; }
    h2 {
      margin: 0; font-size: 21px; font-weight: 800;
      letter-spacing: 3px; text-transform: uppercase;
      background: linear-gradient(110deg, #8a6d1f 0%, #d4af37 30%, #fff3c4 50%, #d4af37 70%, #8a6d1f 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shine 3s linear infinite;
    }

    /* ---- MOVING BACKGROUND SHIMMER ---- */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background: linear-gradient(115deg,
        transparent 0%,
        rgba(212,175,55,0.10) 35%,
        rgba(255,243,196,0.18) 50%,
        rgba(212,175,55,0.10) 65%,
        transparent 100%);
      background-size: 300% 300%;
      animation: sweep 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes sweep {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    header, #log, #typing, form { position: relative; z-index: 1; }

    #stars {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    header, #log, #typing, form { position: relative; z-index: 1; }

    @keyframes shine { to { background-position: 200% center; } }

    .pill {
      padding: 8px 14px; border: 1px solid #d4af37; border-radius: 4px;
      background: transparent; color: #d4af37; font-size: 11px;
      font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: all .15s;
    }
    .pill:hover { background: #d4af37; color: #0c0a07; }
    .mode.active { background: #d4af37; color: #0c0a07; }

    #log { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 12px; }
    #log::-webkit-scrollbar { width: 6px; }
    #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .bubble {
      max-width: 80%; padding: 12px 16px; border-radius: 14px;
      line-height: 1.5; word-wrap: break-word; font-size: 15px;
    }
    .me {
      align-self: flex-end; color: #1a1305;
      background: linear-gradient(135deg, rgba(245,213,118,0.75), rgba(212,175,55,0.75));
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 10px rgba(212,175,55,0.35);
    }
    .ai {
      align-self: flex-start; background: var(--bubble-ai); color: var(--bubble-ai-text);
      border: 1px solid var(--border); border-bottom-left-radius: 4px;
    }
    .error { align-self: center; background: #fdecea; color: #b3261e; font-size: 14px; }
    .ai p:first-child { margin-top: 0; }
    .ai p:last-child { margin-bottom: 0; }
    #typing { color: var(--muted); font-style: italic; display: none; padding: 4px 8px; }

    form { display: flex; gap: 8px; margin-top: 12px; }
    input {
      flex: 1; padding: 12px 16px; font-size: 15px; outline: none;
      background: var(--input-bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
    }
    input:focus { border-color: #d4af37; box-shadow: 0 0 8px rgba(212,175,55,0.3); }
    #send {
      padding: 12px 22px; border: none; border-radius: 4px; cursor: pointer;
      background: linear-gradient(135deg, #f5d576, #d4af37);
      color: #1a1305; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; font-size: 13px;
    }
    #send:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <header>
    <h2>My AI Chat</h2>
    <div>
      <span id="modes">
        <button data-mode="system" class="pill mode" type="button">Auto</button>
        <button data-mode="light" class="pill mode" type="button">Light</button>
        <button data-mode="dark" class="pill mode" type="button">Dark</button>
      </span>
      <button id="newchat" class="pill" type="button">New chat</button>
    </div>
  </header>
  <div id="log"></div>
  <div id="typing">AI is typing…</div>
  <form id="f">
    <input id="msg" placeholder="Type a message..." autocomplete="off">
    <button id="send">Send</button>
  </form>
  <script>
    const log = document.getElementById("log");
    const typing = document.getElementById("typing");
    const input = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    let history = [];
    let controller = null;

    /* ---- THEME SWITCHING ---- */
    let mode = localStorage.getItem("theme") || "system";
    function applyMode() {
      if (mode === "system") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", mode);
      document.querySelectorAll(".mode").forEach(b =>
        b.classList.toggle("active", b.dataset.mode === mode));
      localStorage.setItem("theme", mode);
    }
    document.querySelectorAll(".mode").forEach(b => {
      b.onclick = () => { mode = b.dataset.mode; applyMode(); };
    });
    applyMode();

    input.focus();

    function setBusy(busy) {
      input.disabled = busy;
      sendBtn.disabled = busy;
      typing.style.display = busy ? "block" : "none";
      if (!busy) input.focus();
    }

    document.getElementById("newchat").onclick = () => {
      if (controller) controller.abort();
      history = [];
      log.innerHTML = "";
      setBusy(false);
    };

    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      history.push({ role: "user", text: text });
      log.innerHTML += `<div class="bubble me">${text}</div>`;
      input.value = "";
      log.scrollTop = log.scrollHeight;
      setBusy(true);

      controller = new AbortController();
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
          signal: controller.signal,
        });
        if (!res.ok) throw new Error("Server error " + res.status);
        const data = await res.json();
        history.push({ role: "model", text: data.reply });
        log.innerHTML += `<div class="bubble ai">${marked.parse(data.reply)}</div>`;
        log.scrollTop = log.scrollHeight;
        setBusy(false);
      } catch (err) {
        if (err.name === "AbortError") return;
        history.pop();
        log.innerHTML += `<div class="bubble error">⚠️ Something went wrong — try again</div>`;
        log.scrollTop = log.scrollHeight;
        setBusy(false);
      }
    };

    /* ---- FLOATING GOLD PARTICLES ---- */
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    let stars = [];

    function sizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.onresize = sizeCanvas;
    sizeCanvas();

    for (let i = 0; i < 250; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.8 + 0.4,          // size
        speed: Math.random() * 0.4 + 0.1,       // drift speed
        tw: Math.random() * Math.PI * 2,        // twinkle phase
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of stars) {
        s.y -= s.speed;                          // float upward
        s.tw += 0.03;
        if (s.y < -5) { s.y = canvas.height + 5; s.x = Math.random() * canvas.width; }
        const glow = 0.45 + Math.sin(s.tw) * 0.35;  // twinkle
        const dark = document.documentElement.getAttribute("data-theme") === "dark" ||
          (!document.documentElement.getAttribute("data-theme") &&
           window.matchMedia("(prefers-color-scheme: dark)").matches);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = dark
          ? `rgba(212, 175, 55, ${glow})`
          : `rgba(140, 100, 20, ${glow})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = dark ? "rgba(255, 223, 128, 0.8)" : "rgba(160, 110, 20, 0.6)";
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
